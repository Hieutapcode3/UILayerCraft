<!doctype html>
<html lang="en"><head><meta charset="UTF-8">

<title>Level 10 – Out of Moves</title>

<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="./styles.css"></head>
<body>
<div class="fit-shell">
  <div class="fit-box">
    <main class="screen export-inline-style-1">

      <!-- Top HUD -->
      <header class="hud">
        <div class="hud-level"><span class="txt">Level 12</span></div>
        <div class="hud-settings">
          <img class="settings-gear export-reference-asset-1" src="./assets/settings_gear_icon.png" alt="settings_gear_icon">
        </div>
        <div class="hud-moves">
          <span class="txt label">Move:</span>
          <span class="txt value">67</span>
        </div>
        <div class="hud-coins">
          <div class="pill"><span class="txt">123</span></div>
          <img class="hud-coin-icon export-reference-asset-2" src="./assets/gold_coin_icon.png" alt="gold_coin_icon">
        </div>
      </header>

      <!-- Card slots -->
      <section class="slots">
        <div class="slot slot-purple slot-a"><div class="face"></div></div>
        <div class="slot slot-purple slot-b"><div class="face"></div></div>
        <div class="slot slot-c"><div class="pin"></div></div>
        <div class="slot slot-d"><div class="dash"></div></div>
      </section>

      <!-- Board -->
      <section class="board">
        <div class="well"></div>
        <div class="tile-col r1"></div>
        <div class="tile-col r2"></div>
        <div class="tile-col r3"></div>
        <div class="tile-col r4"></div>
        <div class="tile-col-left"></div>
        <div class="tile tile-1"></div>
        <div class="tile tile-2"><img class="bus export-reference-asset-11" src="./assets/school_bus_tile_illustration.png" alt="school_bus_tile_illustration"></div>
        <div class="tile tile-3"><img class="plane export-reference-asset-12" src="./assets/airplane_tile_illustration.png" alt="airplane_tile_illustration"></div>
        <div class="tile tile-4"></div>
        <div class="tile tile-5"></div>
        
        
      </section>

      <!-- Booster bar -->
      <nav class="boosters">
        <div class="booster booster-1">
          <div class="disc"></div>
          <img src="./assets/magnifier_booster_icon.png" alt="magnifier_booster_icon" class="export-reference-asset-13">
          <div class="badge"><span class="txt">2</span></div>
        </div>
        <div class="booster booster-2">
          <div class="disc"></div>
          <img src="./assets/star_card_booster_icon.png" alt="star_card_booster_icon" class="export-reference-asset-14">
        </div>
        <div class="booster booster-3">
          <div class="disc"></div>
          <img src="./assets/compass_booster_icon.png" alt="compass_booster_icon" class="export-reference-asset-15">
        </div>
        <div class="booster booster-4"><div class="disc"></div></div>
      </nav>

      <!-- Out of moves popup -->
      <section class="popup">
        <div class="popup-frame"></div>
        <div class="popup-panel"></div>

        <div class="popup-header"><h1 class="txt">Level 10</h1></div>
        <img class="popup-close export-reference-asset-3" src="./assets/close_button_red_x_icon.png" alt="close_button_red_x_icon">

        <img class="popup-title export-reference-asset-4" src="./assets/out_of_moves_title_lettering.png" alt="out_of_moves_title_lettering">

        <div class="popup-hero">
          <img class="rays export-reference-asset-5" src="./assets/glow_rays_decoration.png" alt="glow_rays_decoration">
          <img class="moves-icon export-reference-asset-6" src="./assets/blue_swap_moves_icon_with_zero_badge.png" alt="blue_swap_moves_icon_with_zero_badge">
        </div>

        <h2 class="txt popup-subtitle">NO MOVES LEFT!</h2>

        <div class="rewards">
          <div class="reward reward-moves">
            <img src="./assets/green_swap_moves_booster_icon.png" alt="green_swap_moves_booster_icon" class="export-reference-asset-7">
            <span class="txt">+10 MOVES</span>
          </div>
          <div class="divider"></div>
          <div class="divider-dot"></div>
          <div class="reward reward-hint">
            <img src="./assets/magnifier_quick_hint_icon.png" alt="magnifier_quick_hint_icon" class="export-reference-asset-8">
            <span class="txt">1 QUICK HINT</span>
          </div>
        </div>

        <button class="btn btn-ad">
          <span class="txt">Play on</span>
          <img src="./assets/video_clapperboard_ad_icon.png" alt="video_clapperboard_ad_icon" class="export-reference-asset-9">
        </button>
        <button class="btn btn-coin">
          <span class="txt label">Play on</span>
          <img src="./assets/button_gold_coin_icon.png" alt="button_gold_coin_icon" class="export-reference-asset-10">
          <span class="txt price">100</span>
        </button>
      </section>

    </main>
  </div>
</div>

<script src="./script.js"></script></body></html>
