name: Release desktop

# Push a tag such as v1.2.0 to build the Windows installer and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install desktop dependencies
        run: npm install
        working-directory: desktop

      # Builds dist/, bundles this runner's node.exe and runs electron-builder.
      - name: Build installer
        run: npm run dist
        working-directory: desktop

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" desktop/release/*.exe --title "UILayerCraft ${{ github.ref_name }}" --generate-notes
